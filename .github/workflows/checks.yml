name: Package and manual checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[viz]' -r docs/requirements.txt build twine
      - run: python -m unittest discover -s tests
      - run: python tools/update_cli_reference.py && git diff --exit-code docs/source/_generated
      - run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
      - run: python tools/check_docs.py
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: surfacia-distributions
          path: dist/*
