name: Publish reviewed package to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[viz]' -r docs/requirements.txt build twine
      - run: python -m unittest discover -s tests
      - run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
      - run: python tools/check_docs.py
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/surfacia/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
