version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: docs/requirements.txt
formats: []
search:
  ignore:
    - search.html
    - search/index.html
    - 404.html
    - 404/index.html
    - user_guide/spes.html
    - zh/user_guide/spes.html
